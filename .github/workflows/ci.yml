name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.11 tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.12.1 \
            torchvision==0.27.1
          python -m pip install --requirement requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run test suite
        run: python -m unittest discover -s tests -v

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build service image
        run: |
          docker build \
            --file identification_service/Dockerfile \
            --tag face-identification-system:ci \
            .

      - name: Validate container runtime
        run: |
          docker run --rm \
            --entrypoint python \
            face-identification-system:ci \
            -c "import os; from importlib.metadata import version; from identification_service.app import app; assert os.getuid() != 0; assert version('facenet-pytorch') == '2.5.3'; assert version('faiss-cpu') == '1.14.3'; assert version('Flask') == '3.1.3'; assert version('gunicorn') == '26.1.0'; assert version('torch') == '2.12.1+cpu'; assert version('torchvision') == '0.27.1+cpu'; assert {rule.rule for rule in app.url_map.iter_rules()} >= {'/add', '/identify'}; print(f'uid={os.getuid()} routes=verified dependencies=verified')"
          docker run --rm \
            face-identification-system:ci \
            gunicorn --check-config identification_service.app:app
